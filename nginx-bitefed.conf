# Bite Fed Web — Reverse Proxy (HTTP + HTTPS)
# Domain: bitefed.norflabs.com
# SSL: Let's Encrypt (auto-renew via certbot)

# Rate limit untuk webhook & form submission
limit_req_zone $binary_remote_addr zone=bitefed:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=bitefed_conn:10m;

server {
    listen 80;
    server_name bitefed.norflabs.com;

    # ACME challenge path for cert renewal
    location /.well-known/acme-challenge/ {
        root /www/server/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bitefed.norflabs.com;

    ssl_certificate     /etc/letsencrypt/live/bitefed.norflabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitefed.norflabs.com/privkey.pem;

    # Rate limit & connection limit
    limit_req zone=bitefed burst=10 nodelay;
    limit_conn bitefed_conn 20;

    # HSTS: browser wajib HTTPS selama 1 tahun
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP — izinkan Midtrans, Tailwind CDN, Google Fonts, self
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.sandbox.midtrans.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://app.sandbox.midtrans.com; img-src 'self' data:; connect-src 'self' https://app.sandbox.midtrans.com" always;

    # Proxy ke FastAPI di port 8888
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Midtrans webhook — tanpa rate limit ketat
    location /api/webhooks/midtrans {
        limit_req zone=bitefed burst=20 nodelay;
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Blokir akses ke file tersembunyi / backup
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
